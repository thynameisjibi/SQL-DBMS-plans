<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL DBMS Web GUI Mockup</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .sidebar {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            height: calc(100vh - 40px);
            overflow-y: auto;
        }
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .query-editor {
            background: #0f3460;
            border: 1px solid #1a1a2e;
            border-radius: 8px;
            padding: 15px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background: #1a1a2e;
            color: #e0e0e0;
            border: none;
            border-radius: 4px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: vertical;
        }
        .button-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            opacity: 0.9;
        }
        .results-panel {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            min-height: 300px;
            overflow: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #0f3460;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            background: #0f3460;
            font-weight: 600;
        }
        tr:nth-child(even) {
            background: rgba(255,255,255,0.05);
        }
        .table-list {
            list-style: none;
            padding: 0;
        }
        .table-list li {
            padding: 8px;
            margin: 5px 0;
            background: #0f3460;
            border-radius: 4px;
            cursor: pointer;
        }
        .table-list li:hover {
            background: #1a1a2e;
        }
        .error-message {
            background: #e74c3c;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
        .success-message {
            background: #27ae60;
            color: white;
            padding: 10px;
            border-radius: 4px;
            margin-top: 10px;
        }
        h3 {
            margin-top: 0;
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>📊 Schema Browser</h3>
            <ul class="table-list">
                <li>📄 users</li>
                <li>📄 orders</li>
                <li>📄 products</li>
            </ul>
            <div style="margin-top: 20px;">
                <h3>🔧 Transaction</h3>
                <div class="button-row" style="flex-direction: column;">
                    <button style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">BEGIN</button>
                    <button style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);">COMMIT</button>
                    <button style="background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%); color: #1a1a2e;">ROLLBACK</button>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="query-editor">
                <h3>✏️ SQL Query Editor</h3>
                <textarea placeholder="Enter your SQL query here...

Example:
SELECT * FROM users WHERE age > 18;">SELECT * FROM users WHERE age > 18;</textarea>
                <div class="button-row">
                    <button>▶ Execute Query</button>
                    <button style="background: #6c757d;">Clear</button>
                </div>
            </div>
            <div class="results-panel">
                <h3>📋 Results</h3>
                <table>
                    <thead>
                        <tr>
                            <th>id</th>
                            <th>name</th>
                            <th>email</th>
                            <th>age</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>John Doe</td>
                            <td>john@example.com</td>
                            <td>25</td>
                        </tr>
                        <tr>
                            <td>2</td>
                            <td>Jane Smith</td>
                            <td>jane@example.com</td>
                            <td>30</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
